<style>
  :root {
    color-scheme: dark;
    --surface-0: #0b0b0b;
    --surface-1: #151515;
    --surface-2: #1a1a19;
    --surface-3: #20201f;
    --clay: #d97757;
    --clay-hover: #e88e6f;
    --sky: #6ea8d8;

  html { scroll-behavior: smooth; }

  body {

    background: var(--surface-1);
    color: var(--text-primary);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;

  a { color: var(--sky); text-decoration: none; transition: color .18s ease; }
  a:hover { color: var(--sky-hover); text-decoration: underline; text-underline-offset: 3px; }

  .wrap { max-width: 620px; margin: 0 auto; padding: 0 24px; }

  header {
    padding: 96px 24px 72px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: radial-gradient(ellipse 80% 120% at 50% 0%, rgba(217, 119, 87, 0.10), transparent 70%);

  header h1 {

    font-size: 2.75rem;

    letter-spacing: -0.02em;
    margin-bottom: 10px;
    color: #ffffff;
    text-wrap: balance;
  }

  header p {

    font-size: 0.9375rem;
    letter-spacing: 0.12em;
    text-indent: 0.12em;
  }

  nav {

    flex-wrap: wrap;
    justify-content: center;
    gap: 12px 28px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: rgba(21, 21, 21, 0.82);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    z-index: 10;
  }

  nav a { font-size: 0.875rem; color: var(--text-muted); }
  nav a:hover { color: var(--sky); text-decoration: none; }

  section {
    padding: 56px 0;
    border-bottom: 1px solid var(--border);
    scroll-margin-top: 64px;
  }

  .js section {
    opacity: 0;
    transform: translateY(12px);
    transition: opacity .5s ease, transform .5s ease;
  }

  .js section.visible { opacity: 1; transform: none; }

  section:last-child { border-bottom: none; }

  h2 {
    font-family: var(--serif);
    font-size: 1.375rem;
    font-weight: 400;
    margin-bottom: 20px;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  h2::before {
    content: "";
    display: inline-block;
    width: 3px;
    height: 15px;
    border-radius: 2px;
    margin-right: 11px;
    vertical-align: -1px;
  }

  #about h2 { color: var(--clay); }
  #about h2::before { background: var(--clay); }
  #word h2 { color: var(--gold); }
  #word h2::before { background: var(--gold); }
  #projects h2 { color: var(--mint); }
  #projects h2::before { background: var(--mint); }
  #contact h2 { color: var(--lilac); }
  #contact h2::before { background: var(--lilac); }

  section p { color: var(--text-secondary); margin-bottom: 10px; font-size: 0.9375rem; }

  #about p:first-of-type { color: var(--text-primary); }

  #word a { color: var(--gold); }
  #word a:hover { color: #f0cf8c; }

  #links { display: flex; flex-wrap: wrap; gap: 10px; }

  #links a,
  #links .link-disabled {
    font-family: var(--sans);
    font-size: 0.875rem;
    line-height: 1.5;
    padding: 9px 16px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-3);
    color: var(--text-secondary);
    transition: border-color .18s ease, color .18s ease, background .18s ease, transform .18s ease;
  }

  #links a:hover {
    border-color: rgba(127, 196, 163, 0.55);
    color: var(--mint);
    background: rgba(127, 196, 163, 0.08);
    text-decoration: none;
  }

  #links a:active { transform: scale(0.98); }

  #links .link-disabled { opacity: .32; cursor: default; }

  .contact-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 9px;
    font-size: 0.9375rem;
  }

  .contact-row > span {
    color: var(--lilac);
    min-width: 44px;
    font-size: 0.8125rem;
    letter-spacing: 0.04em;
  }

  .contact-row a { color: var(--text-primary); }
  .contact-row a:hover { color: var(--sky-hover); }

  .copy-btn {
    font-family: var(--sans);
    font-size: 0.75rem;
    line-height: 1;
    padding: 5px 10px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: var(--surface-3);
    color: var(--text-muted);
    cursor: pointer;
    transition: border-color .18s ease, color .18s ease, background .18s ease;
  }

  .copy-btn:hover {
    border-color: rgba(168, 148, 212, 0.55);
    color: var(--lilac);
    background: rgba(168, 148, 212, 0.08);
  }

  .copy-btn:active { transform: scale(0.96); }

  .copy-btn.done {

    color: var(--mint);
    background: rgba(127, 196, 163, 0.08);
  }

  footer {

  footer span { color: var(--clay); }

  @media (max-width: 600px) {
    header { padding: 64px 24px 48px; }
    header h1 { font-size: 2.125rem; }
    nav { gap: 10px 20px; }
    section { padding: 44px 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    *, *::before, *::after {
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
    .js section { opacity: 1; transform: none; }
  }
</style>

<script>
  document.documentElement.classList.add('js');

  /* 年份 */
  document.getElementById('year').textContent = new Date().getFullYear();

  /* 滚动渐入 */
  const io = new IntersectionObserver(function (entries) {
    entries.forEach(function (e) {
      if (e.isIntersecting) {
        e.target.classList.add('visible');
        io.unobserve(e.target);
      }
    });
  }, { threshold: 0.08 });

  document.querySelectorAll('section').forEach(function (s) { io.observe(s); });

  /* 复制 */
  function fallbackCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  document.querySelectorAll('.copy-btn').forEach(function (btn) {
    let timer = null;

    btn.addEventListener('click', async function () {
      const text = btn.dataset.copy;
      let ok = false;

      if (navigator.clipboard && window.isSecureContext) {
        try {
          await navigator.clipboard.writeText(text);
          ok = true;
        } catch (e) {
          ok = fallbackCopy(text);
        }
      } else {
        ok = fallbackCopy(text);
      }

      btn.textContent = ok ? '已复制' : '复制失败';
      btn.classList.toggle('done', ok);

      clearTimeout(timer);
      timer = setTimeout(function () {
        btn.textContent = '复制';
        btn.classList.remove('done');
      }, 1600);
    });
  });
</script>
